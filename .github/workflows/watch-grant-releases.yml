name: watch-grant-releases

# grant releases on GitHub (anchore/grant), tagged vX.Y.Z. We poll daily, read the
# latest release tag via the GitHub CLI and, on a new tag: re-vendor the upstream
# static linux_amd64 release tarball (committed verbatim — its filename carries
# the version), bump Version + reset Release in the spec, prepend a %changelog
# entry, commit to main and force-push the build-grant trigger branch so Packit
# fires exactly the grant COPR build. This automates, on every real upstream
# release, what a human would run as `scripts/build-tool.sh grant` by hand.
#
# Like the syft watcher this re-vendors a committed BINARY artifact (git rm the old
# tarball, download + validate the new one, git add it). COPR's build stays
# offline (enable_net=off) — the network only happens HERE, where it's reliable.
# The man page (help2man) and shell completions need NO action: both are
# regenerated from the new binary at build time, so they can never drift from the
# shipped version.
#
# Supply chain: we vendor the VERBATIM upstream tarball and verify its SHA256
# against the checksums.txt published in the same release, and that file's
# Sigstore signature: Anchore signs it with cosign from its release workflow,
# and scripts/verify-signed-checksums.sh accepts no other signer. Every run
# checks it, not only a new release: on an unchanged tag the vendored tarball
# must still match what Anchore signed. Loud-fail (manual review) if the tag
# isn't vX.Y.Z, the signature or the checksum doesn't hold, or the payload isn't
# a valid gzip'd ELF — we must never commit a broken or unverified Source0.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # cosign for scripts/verify-signed-checksums.sh. Pinned to a commit; the
      # action checks the cosign binary it installs against its own checksum.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3, installs cosign v3.1.4

      - name: Sync grant spec + re-vendor tarball on a new upstream release
        run: |
          set -euo pipefail
          DIR=fedora/grant
          SPEC=$DIR/grant.spec
          MARKER=$DIR/.upstream-tag

          # An archived upstream never releases again; ask that first.
          bash scripts/upstream-archived.sh github anchore/grant "$DIR"

          UPSTREAM_TAG=$(gh release view --repo anchore/grant --json tagName -q .tagName)
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "::error::Could not read latest grant release tag from GitHub"
            exit 1
          fi
          if ! printf '%s' "$UPSTREAM_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected grant tag '$UPSTREAM_TAG' (want vX.Y.Z) — upstream may have changed naming; manual review"
            exit 1
          fi

          LOCAL_TAG=$(cat "$MARKER" 2>/dev/null || echo none)
          if [ "$UPSTREAM_TAG" = "$LOCAL_TAG" ]; then
            # Nothing new, but what we ship must still be what Anchore signed.
            VENDORED=grant_${LOCAL_TAG#v}_linux_amd64.tar.gz
            bash scripts/verify-signed-checksums.sh anchore/grant "$LOCAL_TAG" "$VENDORED" "$DIR/$VENDORED"
            echo "Tag unchanged ($LOCAL_TAG) — no rebuild needed"
            exit 0
          fi
          echo "Upstream tag changed: $LOCAL_TAG -> $UPSTREAM_TAG"

          VERSION=${UPSTREAM_TAG#v}
          TARBALL=grant_${VERSION}_linux_amd64.tar.gz
          DEST=$DIR/$TARBALL
          BASE=https://github.com/anchore/grant/releases/download/${UPSTREAM_TAG}

          # Re-vendor: download the tarball (-f makes curl fail on HTTP errors so
          # a 404 can't slip an error page through), check it against the
          # release's signed checksums.txt, then extract just the `grant` member
          # and confirm it's a Linux ELF before we ever touch the tree.
          TMP=$(mktemp); EXDIR=$(mktemp -d)
          curl -fsSL "$BASE/$TARBALL" -o "$TMP"
          bash scripts/verify-signed-checksums.sh anchore/grant "$UPSTREAM_TAG" "$TARBALL" "$TMP"
          if ! tar xzf "$TMP" -C "$EXDIR" grant 2>/dev/null; then
            echo "::error::$TARBALL is not a valid gzip tarball containing 'grant' — refusing to vendor"
            exit 1
          fi
          MAGIC=$(od -An -tx1 -N4 "$EXDIR/grant" | tr -d ' \n')
          if [ "$MAGIC" != "7f454c46" ]; then
            echo "::error::Bundled grant is not an ELF (magic ${MAGIC:-empty}) — refusing to vendor"
            exit 1
          fi
          rm -rf "$EXDIR"

          # The tarball filename carries the version, so the new file is a new
          # path: drop the old one, drop the new one in, stage both moves.
          git rm -q "$DIR"/grant_*_linux_amd64.tar.gz
          mv "$TMP" "$DEST"
          git add "$DEST"

          # New upstream release = fresh identity: reset the packaging-iteration
          # counter and prepend a %changelog entry (LC_ALL=C for an English date;
          # EVR without %{?dist} to match the hand-written entries).
          echo "$UPSTREAM_TAG" > "$MARKER"
          sed -i "s|^Version:.*|Version:        ${VERSION}|" "$SPEC"
          sed -i "s/^Release:.*/Release:        1%{?dist}/" "$SPEC"
          CL_ENTRY=$(mktemp)
          {
            printf '* %s gmipf <gmipf64@gmail.com> - %s-1\n' \
              "$(LC_ALL=C date -u +'%a %b %d %Y')" "$VERSION"
            printf -- '- Automated sync to upstream grant release %s; re-vendored linux_amd64 tarball (checked against the signed checksums), Release reset to 1.\n' "$UPSTREAM_TAG"
            printf '\n'
          } > "$CL_ENTRY"
          sed -i "/^%changelog/r $CL_ENTRY" "$SPEC"
          rm -f "$CL_ENTRY"

          git add "$SPEC" "$MARKER"
          if git diff --cached --quiet; then
            echo "Nothing staged after rewrite — exiting clean"
            exit 0
          fi

          git config user.name "rolling-watcher"
          git config user.email "actions@github.com"
          # The vendored tarball is ~27 MB; lift the post buffer so the push doesn't
          # fall back to a chunked body that must rewind on redirect ("cannot rewind
          # RPC post data"). Same workaround as scripts/build-tool.sh.
          git config http.postBuffer 524288000
          git commit -m "chore: grant ${UPSTREAM_TAG}"

          # main is canonical and builds NOTHING (the copr_build job is scoped to
          # branch build-grant). The trigger branch = main's tree + a cosmetic
          # landing README; force-pushing it fires ONLY the grant COPR job via
          # Packit. Same mechanism as scripts/build-tool.sh — never hand-push main.
          bash scripts/push-retry.sh origin HEAD:main
          git checkout -q -b trigger-tmp
          # shellcheck disable=SC2016  # backticks are Markdown in the landing README, not a substitution
          printf '# build-grant — grant (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch** for the `grant` package: a push here fires\nthe grant COPR build via Packit, nothing else rebuilds. Canonical source is\n`main` (do not edit here). Packaging: `fedora/grant/`.\n' > README.md
          git add README.md
          git commit -q -m "trigger: grant build (${VERSION}-1)"
          bash scripts/push-retry.sh -f origin trigger-tmp:build-grant
