name: check-repo

# Every lint rule of this repo (scripts/lint.sh), in CI, with every tool
# installed: a tool that is missing here fails the run, because not measured
# is not clean. The pre-commit hook (.githooks) runs the same script but skips
# what a machine does not have -- this job is what holds for every clone.
# Next to it, every spec is built with its %check (scripts/rpmbuild-check.sh).
#
# The daily run is not decoration: the watchers commit with the built-in
# GITHUB_TOKEN, and pushes made with it start no other workflow. Without the
# schedule, the spec edits a watcher makes would never be linted here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Fedora, so the tool versions are the ones a Fedora packager has locally.
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install the linters
        run: dnf -y -q install git-core tar gzip /usr/bin/shellcheck /usr/bin/ruff /usr/bin/yamllint /usr/bin/packit /usr/bin/rpmlint rpm-build python3-rpm python3-pyyaml jq xz

      # Not packaged for Fedora. The release binary, pinned by version AND by
      # checksum -- the hash below was read from a download verified against the
      # release's checksums file on 2026-10-13, so this does not trust a file
      # fetched from the same place as the binary.
      - name: Install actionlint
        env:
          V: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_linux_amd64.tar.gz"
          echo "${SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          actionlint -version

      - uses: actions/checkout@v5

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: scripts/lint.sh
        run: bash scripts/lint.sh

      # Every check above, run against a defect planted for it: a check that
      # can no longer turn red fails here instead of passing everything.
      - name: scripts/selftest.py
        run: python3 scripts/selftest.py

  # A push to main builds nothing on COPR, so a spec edited there would first
  # be built when the next upstream release bumps it -- and that release would
  # be stuck. This builds every spec now, the way COPR would, %check included.
  rpmbuild:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      # The image has neither (measured, Fedora 44). git must come before the
      # checkout, which otherwise downloads the files without .git -- and the
      # selftest copies what git tracks.
      - name: Install git and python3
        run: dnf -y -q install git-core python3

      - uses: actions/checkout@v5

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: scripts/rpmbuild-check.sh
        run: bash scripts/rpmbuild-check.sh --install-deps

      # One typical packaging fault per spec, each of which its %check must catch.
      - name: scripts/selftest.py --rpmbuild
        run: python3 scripts/selftest.py --rpmbuild
